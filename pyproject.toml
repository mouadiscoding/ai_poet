[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-poet"
version = "0.1.0"
description = "Arabic poetry dataset generation and model training tools"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "datasets>=4.0.0",
    "huggingface-hub>=1.26.0",
    "pyarrow>=25.0.0",
    "python-dotenv>=1.1.0",
]

[project.scripts]
ai-poet-generate-sft = "ai_poet.synthetic_data.cli:main"
ai-poet-benchmark-endpoints = "ai_poet.synthetic_data.benchmark_cli:main"
ai-poet-pilot-sft = "ai_poet.synthetic_data.pilot_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
